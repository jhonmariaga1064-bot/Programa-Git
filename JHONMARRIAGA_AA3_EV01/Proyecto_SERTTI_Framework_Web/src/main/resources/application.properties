# Configuración del servidor y conexión MySQL - SERTTI Tránsito La Jagua
server.port=8080
spring.application.name=sertti-tramites-framework

# Parámetros de almacenamiento de datos en MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/sertti_tramites_db?useSSL=false&serverTimezone=America/Bogota&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=admin123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
